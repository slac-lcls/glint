[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glint-indexer"
version = "0.1.0"
description = "GLINT: a fast GPU-native blind crystallography indexer for serial crystallography (SFX)"
readme = "README.md"
# Deliberately NOT a "License :: OSI Approved :: BSD" classifier: the terms are BSD-3-Clause
# PLUS an enhancements grant-back (the SLAC/DOE variant, same shape as SPDX BSD-3-Clause-LBNL),
# so naming plain BSD-3-Clause in metadata would misstate them. Point at the file instead.
license = {file = "LICENSE.md"}
requires-python = ">=3.9"
authors = [{name = "Stefano Marchesini", email = "smarches@slac.stanford.edu"}]
maintainers = [{name = "SLAC National Accelerator Laboratory"}]
keywords = ["crystallography", "indexing", "serial-crystallography", "SFX", "GPU", "diffraction", "LCLS"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "torch>=1.12",          # CPU works out of the box; CUDA is used automatically if present
    "h5py>=3",              # imported unguarded by the shipped HDF5/CXI paths (--images, --integrate)
]

[project.urls]
Repository = "https://github.com/slac-lcls/glint"
Changelog = "https://github.com/slac-lcls/glint/blob/main/CHANGELOG.md"
Paper = "https://arxiv.org/abs/2609.07722"

[project.scripts]
glint = "glint.glint_cli:main"

[tool.setuptools]
# engine lives in `glint`; `fftindex` is a thin back-compat alias so old `import fftindex` keeps working
packages = ["glint", "fftindex"]     # experiments/ are research scripts (not shipped)
# Ship the licence and the third-party notices inside the wheel, not just in the repo.
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md"]
