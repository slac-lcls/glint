name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    name: CPU-only tests (no GPU, no psana, no data)
    runs-on: ubuntu-latest
    steps:
      # slac-lcls requires every action pinned to a full-length commit SHA, not a tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # numpy is all the xtc_bridge scripts need; pytest + pydantic are what
        # lute/test_glint_index.py needs (it calls pytest.importorskip("pydantic"),
        # so without pydantic it would silently skip instead of testing anything).
        # scipy is what importing the glint package itself needs -- cupy and numba
        # are both guarded by try/except, but scipy is a hard import in multishot,
        # seed and localize, so without it none of the glint/ tests below can run.
        # h5py is needed by test_integrate_event.py, which has to WRITE a stacked
        # multi-event .cxi to test that integration reads the right event out of it
        # (glint#136). That test skips and exits 0 without h5py, so leaving it out
        # here would make the step green while testing nothing.
        run: python -m pip install --upgrade pip numpy scipy pytest pydantic h5py

      - name: lute/test_glint_index.py
        run: python -m pytest test_glint_index.py -q
        working-directory: lute

      # Regression tests for glint/ itself. Same script-style contract as the
      # xtc_bridge ones (print, then sys.exit(1) on failure), but run from the repo
      # root with PYTHONPATH=. so `import glint` resolves to the worktree.
      - name: experiments/test_alias_gate.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_alias_gate.py

      - name: experiments/test_pf8_thr_adu.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_pf8_thr_adu.py

      - name: experiments/test_asic_seam_mask.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_asic_seam_mask.py

      - name: experiments/test_negative_intensities.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_negative_intensities.py

      # The xtc route's --integrate pass predicts each event at the wavelength (review s7-03) and in
      # the frame (s7-01) pass 1 indexed it in: without --wavelength it used to predict at 0.0, which
      # puts every reflection on the beam centre, and the unconverted pass-1 orientation put every box
      # on the observed pattern inverted through the beam centre. Runs glint_xtc.main end to end with
      # psana, cupy, PeakFinderV4 and the torch indexer mocked, and checks the written .stream against
      # an independent CrystFEL-frame forward model; also the refusal when no wavelength reaches
      # pass 2, and predict_spots refusing a non-positive wavelength. numpy + scipy only.
      - name: experiments/test_xtc_integrate_wavelength.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_xtc_integrate_wavelength.py

      # The peaks-route integrator's event addressing (glint#136). It builds a 3-event .cxi and
      # checks the three frames integrate to three DIFFERENT intensities -- which is exactly what
      # the shipped code could not do, and nothing else here would have noticed.
      - name: experiments/test_integrate_event.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_integrate_event.py

      # The device ladder must never select MPS: replica_gpu's module-level float64 tensors crash
      # on it at import, and `--device cpu` did not rescue that (glint#161). The SOURCE half of
      # this test needs no torch, so it really runs here -- which is the point, since this job
      # installs no torch and a skip-only test would stay green with the defect restored.
      - name: experiments/test_device_selection.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_device_selection.py

      # Un-assembled multi-panel input integrates slab-locally via the .geom's integer dimN keys
      # (glint#148): 4 panels sharing 2 slabs, each recovering its OWN planted flux; the 4-D
      # event+panel path; the no-mapping refusal; and the window-exceeds-slab mismatch error.
      - name: experiments/test_panel_stack_integrate.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_panel_stack_integrate.py

      # The --images route (integrate_cxi) now puts the .cxi through the SAME layout decision as
      # _load_image (predict._leading_axis_is_events): a stacked (event, ss, fs) file still integrates
      # every event against its own frame, while an un-assembled (panel, ss, fs) stack under a
      # multi-panel geometry is refused by name (glint#148) instead of data[ev] handing back one
      # panel's pixels as event ev's frame. Builds its files with h5py (installed above).
      - name: experiments/test_integrate_cxi_layout.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_integrate_cxi_layout.py

      # The .geom `data =` key must reach integration (glint#143). parse_geom used to drop it,
      # so the peaks+--integrate route could never read a non-default dataset path; #142's test
      # passed data_path explicitly, which is why CI stayed green through the defect.
      - name: experiments/test_geom_data_key.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_geom_data_key.py

      - name: experiments/test_consensus_degenerate.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_consensus_degenerate.py

      - name: experiments/test_consensus_order.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_consensus_order.py

      - name: experiments/test_stream_gate_lock.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_stream_gate_lock.py

      # Covers the watchdog relock path (rescue + alias gate) that test_stream_gate_lock.py does not
      # reach. It was already failing on main when it was added -- unrun -- which is how the #112
      # rescue regression shipped.
      - name: experiments/test_lock_probe.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_lock_probe.py

      - name: experiments/test_running_consensus.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_running_consensus.py

      # The pool-keyed lock gate ships as a production DEFAULT, which lives only in
      # StreamDriver.__init__'s signature and its one call site. test_running_consensus.py
      # above covers the rule; this covers the wiring, and without it dropping those
      # kwargs passes every other suite here.
      - name: experiments/test_lock_gate_wiring.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_lock_gate_wiring.py

      # The Laue-class operator registry (glint#180): group order/closure/inversion per class,
      # metric preservation on a cell of each system, and laue_ops("4/mmm") pinned element-for-
      # element against a frozen copy of the pre-#180 laue_ops_4mmm.
      - name: experiments/test_laue_ops.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_laue_ops.py

      # ...and that StreamDriver USES it: an orthorhombic set merged under laue="mmm" vs the default
      # gives different ASU-key counts and the right theoretical_unique; the default path is
      # bit-identical to a direct laue_ops_4mmm() accumulator; stream_symmetry derives the class;
      # tetragonal standardization is applied for 4/m and 4/mmm only (lock and watchdog paths).
      - name: experiments/test_streamdriver_laue.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_streamdriver_laue.py

      # Script-contract fixes: each of these swallowed its own assertion failures and exited 0,
      # so none could have failed a CI step before now. Exit codes verified by deliberately
      # breaking an assertion in each. All five run on numpy+scipy alone -- numba, torch and
      # cupy are import-guarded, and the driver tests inject their own blind indexer/fan-out
      # rather than reaching for a GPU, so nothing here degrades silently on the CPU runner.
      - name: experiments/test_multilattice.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_multilattice.py

      # The double-hit acceptance rule and misorientation_deg, which it gates on. The angle must be a
      # property of the two LATTICES: same lattice in any basis or handedness -> 0 deg, planted
      # rotations exact, symmetry found for all 14 Bravais classes, two real replay pairs.
      - name: experiments/test_double_hit_rule.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_double_hit_rule.py

      - name: experiments/test_warmup_batch.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_warmup_batch.py

      - name: experiments/test_missbuf_rescue.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_missbuf_rescue.py

      # A permanently failing blind fan-out must degrade to the miss path, not crash flush()
      # (glint#147): survival, the no-votes rule, the failure streak + counter, short-return
      # padding, and the healthy path staying untouched.
      - name: experiments/test_watchdog_fanout_guard.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_watchdog_fanout_guard.py

      # The opt-in retry cascade (glint#75). Injects the batched/blind/per-frame indexers through the
      # same seams test_missbuf_rescue.py uses, so the whole thing runs on numpy alone. Covers both
      # halves of the contract: flag OFF the gate-failing frame is a miss with no cascade counters at
      # all, flag ON it is integrated exactly once and is NOT also counted as a miss.
      - name: experiments/test_retry_cascade.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_retry_cascade.py

      # The opt-in escalation (retry_cascade.arm_known_deep, hybrid_index(escalate=...)): a deep known-cell
      # fit is kept only if no azimuth-scrambled copy of the frame matches as many peaks; the null is
      # sequential; escalate=None leaves hybrid_index untouched. Scripted indexers, torch modules stubbed.
      - name: experiments/test_escalation.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_escalation.py

      # hybrid_index(select=...): "first" (default) is the shipped pick; "matched" runs the known-cell search on
      # every frame and keeps the consistent candidate matching the most peaks. Scripted indexers, torch stubbed.
      - name: experiments/test_select_matched.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_select_matched.py
      # The CrystFEL --indexing=file solution file puts the axes in the setting its lattice code names: with a
      # reference cell, monoclinic codes get the reference's setting (the r136 mCb rejection); tetragonal etc. unchanged.
      - name: experiments/test_solution_file.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_solution_file.py
      - name: experiments/test_cell_registry.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_cell_registry.py
      - name: experiments/test_record_stream_event_id.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_record_stream_event_id.py

      - name: experiments/test_per_lattice.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_per_lattice.py

      # StreamDriver(null_floor=...): the live gate's opt-in chance floor n_inl >= a*n + b + c*sqrt(n). Default
      # = the historical two-bar rule on a grid of counts; through flush() a sparse frame at the measured chance
      # level is refused while a sparse and a dense control are kept; the floor reaches the rescue and best-fit
      # sites. Fit-oracle indexers, numpy only here; its real-frame half runs in the CPU-torch job.
      - name: experiments/test_live_gate_floor.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_live_gate_floor.py

      # StreamDriver hits_only (a frame with no usable peak list gives its ring slot back, so B counts hits)
      # and rescue_pixels (the warm-up and relock rescues integrate the frames they recover). Rendered
      # pixel frames through the real peak finder and integrator; fit-oracle indexers, numpy only.
      - name: experiments/test_stream_hit_ring.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_stream_hit_ring.py

      # StreamDriver effort= (adaptive effort): the known-cell depth follows the hit rate, the spare budget buys
      # the chance-controlled deep search on the misses, decisions at flush boundaries only and logged; off by
      # default and byte-identical off. q-list frames, fit-oracle indexers, numpy only.
      - name: experiments/test_stream_effort.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_stream_effort.py

      # docs/stream_driver_options.md is the constructor's option reference: it must name every keyword of
      # StreamDriver.__init__ and every _EffortPolicy setting exactly once, nothing else, and cite only recorder
      # flags that exist. Text against the signature; nothing is constructed.
      - name: experiments/test_stream_driver_options_doc.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_stream_driver_options_doc.py

      - name: experiments/test_geom_bridge.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_geom_bridge.py

      - name: experiments/test_cli_smoke.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_cli_smoke.py

      # ~50s, by far the slowest step here: it refines over 540 synthetic frames. Kept because
      # it is the only cover of the geometry-refinement solver, but it is the first candidate
      # to trim if this job gets tight.
      - name: experiments/test_geom_refine.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_geom_refine.py

      # THE GUARD ITSELF. Until now check_numbers.py ran only in a local pre-push hook, so every
      # FACTS assertion in it -- the M3 splits, the pool-gate block, the retired-value rules --
      # was enforced on one machine and not in CI. Editing a stored split left CI green.
      #
      # What runs HERE is check_arithmetic() in full (which is where those assertions live) plus
      # the in-repo docs (README/ROADMAP/GLINT_REPORT, CONTRIBUTING.md and docs/, 8 files as of
      # 2026-08-27), now resolved from the checkout instead of ~/git/glint. The paper and the
      # decks live outside the repo and are reported as SKIP -- 8 checked, 8 skipped on a bare
      # runner. That is the honest scope: this step cannot catch a number drifting in
      # glint_rewrite_JAC_refined.tex, and the pre-push hook still has to.
      - name: experiments/check_numbers.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/check_numbers.py

      # ...and the statistics that guard uses. check_numbers.py imports nothing third-party, so
      # its Tango score interval for the paired difference is written out by hand; this pins the
      # closed-form MLE against brute force and the interval against its COVERAGE. Two earlier
      # hand-written versions passed inspection while being wrong -- one with swapped bounds, one
      # conditioning on the discordant count and reporting a marginal claim.
      - name: experiments/test_check_numbers_ci.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_check_numbers_ci.py
      - name: experiments/test_fp32_b32_033_rule.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_fp32_b32_033_rule.py

      # The strict acceptance gate has ONE home (glint/glint_fast.py GATE_TOL/GATE_FRAC/GATE_MIN,
      # glint#170); this asserts every formerly-inlined copy still IMPORTS it -- a re-inlined
      # 0.15/0.25/10, or a strict_gate() helper routed back through the configurable matched()
      # (the QDIST footgun), fails here. The AST half runs on this torch-less runner; the import
      # half self-skips without torch, like test_gate_project.py's GPU half.
      - name: experiments/test_gate_constants_dedup.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_gate_constants_dedup.py

      # The pooled-vote acceptance gate (CONSENSUS_MIN_FRAC / _MIN_LEAD) now lives in the torch-free
      # glint.multishot and is only RE-EXPORTED by hybrid_stream, so its shipped value is readable on
      # this runner for the first time: the numpy half pins (0.02, 1.5) and that hybrid_stream.py no
      # longer carries a second os.environ definition; the re-export half self-skips without torch.
      - name: experiments/test_consensus_gate_constants.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_consensus_gate_constants.py

      # Re-derives the sequential-stop FACTS (seqstop_median_lock, seqstop_false_locks,
      # poolgate_clean_lock_max, poolgate_clean_maxpool) by replaying RunningConsensus over the cached
      # cxidb-120 N-best (nbest_120.npz) in deposition order and 400 seeded random orders, ~2 s,
      # numpy only. Until now those four were measured once by an out-of-tree script and only their
      # QUOTES were guarded, so a stop-rule change left CI green. SCOPE: the seqstop_* pair is the
      # n=480 headline and no 480-frame N-best cache is in the tree, so what this re-derives for them
      # is the FACTS comment's own "The 120 reproduces (median 6, 0/400)"; the poolgate_clean_* pair IS
      # an n=120 measurement. The two tail values are seed-pinned; the docstring says which checks are
      # load-bearing and which are "the tail has not moved".
      - name: experiments/test_seqstop_replay.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_seqstop_replay.py

      # A merged consensus group's SUPPORT must equal the hypotheses within tolerance of the matrix
      # that gets locked (glint#182): the pre-fix witness-as-representative reported support 6 on a
      # pool where only 3 cells matched the lock, and the replay above never takes the merge path,
      # so nothing else here could have noticed. The issue's probe, a witness that really covers
      # everyone, randomised forced merges with the invariant checked after every add, and the
      # driver's consensus_members diagnostic. Numpy only.
      - name: experiments/test_consensus_voter_set.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_consensus_voter_set.py

      - name: experiments/test_same_lattice_symmetry.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_same_lattice_symmetry.py


      # The GPU comparison itself cannot run here, but its PASS/FAIL RULES can: without cupy this
      # runs compare_outputs' sabotage self-test (NaN/inf in each of the four outputs, tolerance
      # boundaries, the exactness rules) and exits 0 on the device half. Those rules shipped
      # NaN-blind -- `worst > ATOL` reads False on a NaN, so an invalid intensity passed -- and
      # nothing executed them off a GPU node.
      - name: experiments/bench_integrate_fused.py (checker self-test, skips the GPU half)
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/bench_integrate_fused.py

      # SKIPS here, deliberately. A green check on this step is NOT coverage of the fused
      # gate+project kernel: the skip returns before a single HKLGrid is built, so everything
      # inside main() is untested on this runner and has to be run on a GPU node by hand.
      # What it does buy is IMPORT-time cover -- the module body still resolves HKLGrid,
      # _panel_geom, recip_from_M and cell_to_Ar, and still evaluates the module-level
      # cell_to_Ar call -- so a rename or removal in glint/ fails here instead of lying in
      # wait. That is worth a step because the file sat broken on main for exactly one reason:
      # nothing ever executed it. It exits 0 when it skips, so it fails the job only on real rot.
      - name: experiments/test_gate_project.py (skips without a GPU)
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_gate_project.py

      # ONE axis-setting rule for the frame and for the reference cell (glint#181). _canonical_axes
      # sorted by length to (long, long, short) while _conventional_tetragonal took the equal pair as
      # a,b, so for c > a cells (58/58/130) an accepted frame was predicted in a different setting
      # from the HKLGrid / 4mmm reference and the grid missed 19% of its reflections. Pins both
      # wrappers to glint.lattice.standardize_axes at random orientations and incoming settings,
      # right-handed and idempotent, the (long, long, short) fallback for cells with no equal pair,
      # and 0 missing predictions grid-vs-predict_spots on three tetragonal cells. numpy-only.
      - name: experiments/test_axis_standardizer.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_axis_standardizer.py

      # Not a test: it checks that run_ci_locally.py's STEPS still matches the steps above, so the
      # local "run it as poor as CI" harness cannot quietly fall behind this file and start
      # reporting ALL PASS over a step it no longer runs.
      - name: experiments/run_ci_locally.py --check-sync
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/run_ci_locally.py --check-sync


      # The xtc_bridge tests are plain scripts, not pytest test functions: they
      # print their own results and sys.exit(1) on failure. They insert their own
      # directory on sys.path and import sibling modules, so each is run from
      # experiments/xtc_bridge. Each gets its own step so a failure is attributed
      # to a file; `if: ${{ !cancelled() }}` keeps later files running after an earlier
      # failure, and the job still fails overall.
      - name: experiments/xtc_bridge/test_geom_manifest.py
        if: ${{ !cancelled() }}
        run: python test_geom_manifest.py
        working-directory: experiments/xtc_bridge

      - name: experiments/xtc_bridge/test_geom_provenance.py
        if: ${{ !cancelled() }}
        run: python test_geom_provenance.py
        working-directory: experiments/xtc_bridge

      # Compares GpuCalibrator._common_mode against golden outputs generated once from real psana
      # (common_mode_golden.npz). This runner has no psana, but the check is NOT a no-op: all five
      # modes, the bank split and the npix_min boundary run against those goldens, and the test
      # ASSERTS each mode bit has a nonzero correction in the set -- at the original 64-column
      # golden geometry the rows mode could never fire (8-px groups < npix_min) and a broken rows
      # block passed CI; the 192-column goldens + that assert close the gap. Where psana IS
      # available the same test additionally compares at full detector size and re-derives the
      # goldens, so a stale golden cannot go unnoticed.
      - name: experiments/xtc_bridge/test_gpu_calib_cm.py
        if: ${{ !cancelled() }}
        run: python test_gpu_calib_cm.py
        working-directory: experiments/xtc_bridge

      - name: experiments/xtc_bridge/test_gpu_calib_wiring.py
        if: ${{ !cancelled() }}
        run: python test_gpu_calib_wiring.py
        working-directory: experiments/xtc_bridge

      - name: experiments/xtc_bridge/test_shard.py
        if: ${{ !cancelled() }}
        run: python test_shard.py
        working-directory: experiments/xtc_bridge

  torch-cpu-tests:
    name: torch-CPU tests (${{ matrix.torch }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: '3.10'
            torch: torch==1.11.0+cpu
          - python-version: '3.11'
            torch: torch
    steps:
      # slac-lcls requires every action pinned to a full-length commit SHA, not a tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip numpy scipy
          python -m pip install "${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu

      # The scatter_reduce_(amin) shim under lattice-candidate dedup: a wrong answer does not
      # crash, it silently changes WHICH candidates survive (glint_index.py::_first_index_per_group).
      - name: glint/test_first_index_per_group.py
        run: python -m glint.test_first_index_per_group

      # The N-best PREFIX contract -- index_blind_nbest(q, 10)[:3] == index_blind_nbest(q, 3), the
      # promise #145's cascade reuses one N-best call on -- checked on 3 real cxidb frames. It is
      # device-independent (N only truncates), so it runs for REAL here on CPU torch (~0.5 s a frame;
      # the CPU scores reproduce nbest_120.npz's GPU scores to 6 decimals) instead of waiting for a
      # GPU node. Self-skips on torch < 1.12 (pyproject's floor -- the 1.11 leg exists for
      # glint_index's scatter_reduce shim, not the indexer) and without torch, which is the path
      # run_ci_locally.py exercises.
      - name: experiments/test_nbest_prefix.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_nbest_prefix.py

      # The known-cell engine's precision defaults (fp32 working precision since 26 Sep 2026, fp64 3x3 solve on
      # the torch path, KC_FP=64 restoring fp64), and the same strict decisions in both on 30 real frames (CPU).
      - name: experiments/test_kc_precision_default.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_kc_precision_default.py

      # A captured known-cell CUDA graph holds the cell parameters it reads by address (fp32 azimuth copies that
      # only P referenced were freed under a cached graph); graph/stream API stood in on CPU; self-skips without torch.
      - name: experiments/test_stage_graph_keeps_params.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_stage_graph_keeps_params.py

      # The known-cell search depth (replica_gpu: topa, nc) is CHECKED, not coerced: nc=0 used to keep one
      # anchor direction and a float was truncated (Copilot review of #208). Argument checks plus a real-frame
      # nc=1 / nc=3 run on CPU torch; self-skips without torch or below the 1.12 floor.
      - name: experiments/test_known_depth_args.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_known_depth_args.py

      # Review r2 s4-01: the known-cell engines returned triclinic / monoclinic frames as a mirrored, non-lattice
      # basis (half-sphere anchors + a forced handedness) or in an inequivalent setting, and StreamDriver
      # integrated them. Per-frame, batched and the real StreamDriver path on simulated stills; orthogonal-a2
      # cells (incl. lysozyme and its consensus cells) must not take the new path, and near-orthogonal triclinic
      # / monoclinic cells take it when their Laue class is given (laue=). Self-skips below 1.12.
      - name: experiments/test_kc_setting.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_kc_setting.py

      # The live gate's chance floor on REAL frames: the committed 120 cxidb-17 frames and four azimuth-scrambled
      # copies each, searched with the lysozyme cell by index_fused on CPU torch. The live gate accepts about half
      # of the copies, the floor under 2.5%, and it keeps >= 90% of the strict-gate frames. Self-skips below 1.12.
      - name: experiments/test_live_gate_floor.py (real frames, CPU torch)
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_live_gate_floor.py

      # glint_cli --gate: with --cell every frame is registered and same_lattice cannot fail, so --gate strict
      # applies the paper's scoring bar to what is WRITTEN. Synthetic frames, 30 real cxidb-17 frames against
      # their azimuth-scrambled copies (CPU torch), and the CLI end to end; self-skips without torch.
      - name: experiments/test_cli_gate.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_cli_gate.py

      # glint_cli --gate floor: strict plus a per-peak-count chance floor fitted on azimuth-scrambled frames for the
      # CLI's own --cell route (experiments/cli_gate_null.py). Synthetic frames with exact counts; the committed 120's
      # sparse frames and their scrambled copies through the route (strict writes many copies, floor almost none,
      # floor keeps the real frames); the CLI end to end, incl. the default stream == --gate none. Self-skips without torch.
      - name: experiments/test_cli_gate_floor.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_cli_gate_floor.py

      # Review r2 s4-02: the batched known-cell engine's coarse 4096-direction anchor grid is used only where it is
      # safe -- orthogonal cell AND L0 * (the frame's largest |q|) <= KC_ADAPT_L0Q (25). Lysozyme / cxidb-17 stays on
      # it; 100x120x150 A at 1.8 A gets the full grid (7/16 orientation-correct on 149370e, >= 14/16 required). Also a
      # mixed-grid batch and the CUDA-graph path's grid-keyed cache (stand-in graph on CPU). Self-skips below 1.12.
      - name: experiments/test_adaptive_grid_basin.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_adaptive_grid_basin.py
