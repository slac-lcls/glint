name: CI

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    name: CPU-only tests (no GPU, no psana, no data)
    runs-on: ubuntu-latest
    steps:
      # slac-lcls requires every action pinned to a full-length commit SHA, not a tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # numpy is all the xtc_bridge scripts need; pytest + pydantic are what
        # lute/test_glint_index.py needs (it calls pytest.importorskip("pydantic"),
        # so without pydantic it would silently skip instead of testing anything).
        # scipy is what importing the glint package itself needs -- cupy and numba
        # are both guarded by try/except, but scipy is a hard import in multishot,
        # seed and localize, so without it none of the glint/ tests below can run.
        run: python -m pip install --upgrade pip numpy scipy pytest pydantic

      - name: lute/test_glint_index.py
        run: python -m pytest test_glint_index.py -q
        working-directory: lute

      # Regression tests for glint/ itself. Same script-style contract as the
      # xtc_bridge ones (print, then sys.exit(1) on failure), but run from the repo
      # root with PYTHONPATH=. so `import glint` resolves to the worktree.
      - name: experiments/test_alias_gate.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_alias_gate.py

      - name: experiments/test_pf8_thr_adu.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_pf8_thr_adu.py

      - name: experiments/test_consensus_degenerate.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_consensus_degenerate.py

      - name: experiments/test_stream_gate_lock.py
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python experiments/test_stream_gate_lock.py

      # The xtc_bridge tests are plain scripts, not pytest test functions: they
      # print their own results and sys.exit(1) on failure. They insert their own
      # directory on sys.path and import sibling modules, so each is run from
      # experiments/xtc_bridge. Each gets its own step so a failure is attributed
      # to a file; `if: ${{ !cancelled() }}` keeps later files running after an earlier
      # failure, and the job still fails overall.
      - name: experiments/xtc_bridge/test_geom_manifest.py
        if: ${{ !cancelled() }}
        run: python test_geom_manifest.py
        working-directory: experiments/xtc_bridge

      - name: experiments/xtc_bridge/test_geom_provenance.py
        if: ${{ !cancelled() }}
        run: python test_geom_provenance.py
        working-directory: experiments/xtc_bridge

      - name: experiments/xtc_bridge/test_gpu_calib_cm.py
        if: ${{ !cancelled() }}
        run: python test_gpu_calib_cm.py
        working-directory: experiments/xtc_bridge

      - name: experiments/xtc_bridge/test_gpu_calib_wiring.py
        if: ${{ !cancelled() }}
        run: python test_gpu_calib_wiring.py
        working-directory: experiments/xtc_bridge

      - name: experiments/xtc_bridge/test_shard.py
        if: ${{ !cancelled() }}
        run: python test_shard.py
        working-directory: experiments/xtc_bridge
